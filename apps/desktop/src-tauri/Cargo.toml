[package]
name = "imperium-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium desktop app's native shell"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
imperium-client = { version = "0.1.0", path = "../../../crates/imperium-client" }
imperium-config = { version = "0.1.0", path = "../../../crates/imperium-config" }
imperium-protocol = { version = "0.1.0", path = "../../../crates/imperium-protocol" }
reqwest = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tokio = { version = "1.54.1", features = ["macros", "sync", "time"] }

[lints]
workspace = true
