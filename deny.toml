# cargo-deny policy (docs/plans/code-mode.md, C1 "Pinning and supply chain"): known vulnerabilities,
# licences (Monty bundles parts of the Python standard library under Python-2.0.1), and sources
# limited to crates.io. Run in CI by the `deny` job and weekly by .github/workflows/advisories.yml.

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-apple-darwin",
  "aarch64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[advisories]
version = 2
yanked = "deny"
# An advisory is ignored only with a reason and a way back, one entry each.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "MIT",
  "MIT-0",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "MPL-2.0",
  "CC0-1.0",
  "0BSD",
  "BSL-1.0",
  "Unlicense",
  "OpenSSL",
  "CDLA-Permissive-2.0",
  # The CPython standard-library parts Monty bundles.
  "Python-2.0",
  "Python-2.0.1",
]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
