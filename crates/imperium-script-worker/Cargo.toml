[package]
name = "imperium-script-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The sandboxed Monty worker behind run_script: one confined process per program"

[lib]
name = "imperium_script_worker"
path = "src/lib.rs"

# The shipped worker, bundled as the sidecar `imperium-script`.
[[bin]]
name = "imperium-script"
path = "src/main.rs"

# Test-only binaries. Built only with the `test-support` feature, so no release build has them.
[[bin]]
name = "confinement-probe"
path = "src/bin/confinement_probe.rs"
required-features = ["test-support"]

[[bin]]
name = "misbehaving-worker"
path = "src/bin/misbehaving_worker.rs"
required-features = ["test-support"]

[[bin]]
name = "windows-probe"
path = "src/bin/windows_probe.rs"
required-features = ["test-support"]

[features]
# Test hooks: the `--force-confinement-failure` flag of the worker and the test binaries.
# Enabled only by this crate's own dev-dependency below and by `scripts/check-rust.sh`.
test-support = []

# Monty is pinned to one release, exactly, and recorded in runtimes/monty.env (checked by
# scripts/ci/check-monty-pin.sh). Cargo verifies every crates.io checksum against Cargo.lock.
[dependencies]
# The worker drives `monty::MontyRun` itself (src/serve.rs) and uses `monty-proto` only for the
# frames and message types, without its `worker` feature: that feature brings the type checker
# (ty, salsa, zip) that programs never use (plan F12). `tzdb-bundled` is what the feature used to
# turn on: the time-zone database is compiled in, so no program makes the worker open a file.
monty = "=1.6.0"
monty-alloc = { version = "=1.6.0", features = ["exit-code"] }
monty-proto = "=1.6.0"
monty-types = { version = "=1.6.0", features = ["tzdb-bundled"] }

[target.'cfg(unix)'.dependencies]
# Safe wrappers for the resource limit and the process-wide flags the confinement sets.
rustix = { version = "1.1.6", default-features = false, features = ["std", "process", "thread", "fs"] }
# `close_range`, `close` and `getdtablesize` for the inherited-descriptor sweep (confine/fds.rs).
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
seccompiler = { version = "0.5.0", default-features = false }

[target.'cfg(windows)'.dependencies]
# The worker's check that the daemon launched it confined (confine/windows.rs), and the Windows
# probe's attempts (src/bin/windows_probe.rs).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Credentials",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
imperium-script = { path = "../imperium-script", features = ["test-support"] }
imperium-script-worker = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "io-util", "net"] }

[target.'cfg(windows)'.dev-dependencies]
# The daemon's named pipe, as the Windows confinement test's stand-in for it.
imperium-ipc = { path = "../imperium-ipc" }

# macOS needs the sandbox and Mach calls, Windows the token and job checks, all C and unsafe. Only
# the modules that need them opt in (`#[allow(unsafe_code)]`); the rest of the crate still denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
