[package]
name = "imperium-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web search and fetch tools for Imperium agents"

[dependencies]
futures-util = "0.3.34"
imperium-api = { version = "0.1.0", path = "../imperium-api" }
imperium-protocol = { version = "0.1.0", path = "../imperium-protocol" }
reqwest = { version = "0.13.5", features = ["json", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "process", "sync", "macros"] }
tokio-tungstenite = "0.30.0"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
