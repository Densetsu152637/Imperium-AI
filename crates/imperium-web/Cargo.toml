[package]
name = "imperium-web"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Web search and fetch tools for Imperium agents"

[dependencies]
futures-util = "0.3.34"
imperium-api = { version = "0.2.0", path = "../imperium-api" }
imperium-policy = { version = "0.2.0", path = "../imperium-policy" }
imperium-tools = { version = "0.2.0", path = "../imperium-tools" }
imperium-protocol = { version = "0.2.0", path = "../imperium-protocol" }
reqwest = { version = "0.13.5", features = ["json", "query"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "time", "process", "sync", "macros", "net", "io-util", "fs"] }
url = "2.5.8"
tracing = "0.1.44"

[target.'cfg(unix)'.dependencies]
# The browser's debugging pipe at fds 3 and 4 in the child (launch.rs).
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
# The browser's launch with only its pipe handles inherited (launch.rs).
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
] }

# Starting the browser with its debugging pipe needs a few C and Win32 calls, which are unsafe.
# Only `launch.rs` opts in (`#[allow(unsafe_code)]`); the rest of the crate denies it.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
