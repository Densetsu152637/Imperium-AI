[package]
name = "imperium-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Skills, hooks, slash commands, and Claude Code plugin compatibility for Imperium"

[dependencies]
imperium-api = { version = "0.1.0", path = "../imperium-api" }
imperium-mcp = { version = "0.1.0", path = "../imperium-mcp" }
imperium-tools = { version = "0.1.0", path = "../imperium-tools" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "process", "io-util", "time", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
