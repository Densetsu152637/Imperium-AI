[package]
name = "imperium-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium daemon"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
constant_time_eq = "0.6.1"
futures-util = "0.3.34"
getrandom = "0.4.3"
imperium-api = { version = "0.2.0", path = "../imperium-api" }
imperium-automation = { version = "0.2.0", path = "../imperium-automation" }
imperium-config = { version = "0.2.0", path = "../imperium-config" }
imperium-engine = { version = "0.2.0", path = "../imperium-engine" }
imperium-extensions = { version = "0.2.0", path = "../imperium-extensions" }
imperium-github = { version = "0.2.0", path = "../imperium-github" }
imperium-ipc = { version = "0.2.0", path = "../imperium-ipc" }
imperium-local = { version = "0.2.0", path = "../imperium-local" }
imperium-mcp = { version = "0.2.0", path = "../imperium-mcp" }
imperium-media = { version = "0.2.0", path = "../imperium-media" }
imperium-memory = { version = "0.2.0", path = "../imperium-memory" }
imperium-models = { version = "0.2.0", path = "../imperium-models" }
imperium-pets = { version = "0.2.0", path = "../imperium-pets" }
imperium-protocol = { version = "0.2.0", path = "../imperium-protocol" }
imperium-policy = { version = "0.2.0", path = "../imperium-policy" }
imperium-tools = { version = "0.2.0", path = "../imperium-tools" }
imperium-web = { version = "0.2.0", path = "../imperium-web" }
imperium-workflow = { version = "0.2.0", path = "../imperium-workflow" }
notify-rust = "4.18.2"
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = "1.0.229"
serde_json = "1.0.154"
similar = "2.7.0"
sha2 = "0.11.1"
sysinfo = { version = "0.38.4", default-features = false, features = ["system"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Identifying the desktop app for plugin approvals (`app_identity/linux.rs`) without `unsafe`:
# rustix for pidfds, SO_PEERCRED, poll and /proc; nix only for SO_PEERPIDFD, which rustix lacks.
nix = { version = "0.31.3", default-features = false, features = ["socket"] }
rustix = { version = "1.1.6", features = ["event", "fs", "net", "param", "process", "time"] }

[target.'cfg(windows)'.dependencies]
# Check 7 of plugin approvals: the per-machine Program Files folder from
# SHGetKnownFolderPath(FOLDERID_ProgramFiles) through dirs-sys's safe wrapper.
dirs-sys = "0.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_UI_Shell"] }
# The daemon puts itself in a kill-on-close job, so its children end with it however it dies.
win32job = "2.0.3"

[features]
# Hooks for the crate's integration tests (fault injection); never enabled in a release build.
testing = []

[lints]
workspace = true

[dev-dependencies]
imperium-client = { path = "../imperium-client" }
imperium-config = { path = "../imperium-config" }
imperium-core = { path = ".", features = ["testing"] }
imperium-github = { path = "../imperium-github" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "test-util"] }
tokio-tungstenite = "0.30.0"
