[package]
name = "imperium-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Media tools for Imperium agents: images (OpenAI-compatible or ComfyUI), speech, and transcription"

[dependencies]
base64 = "0.23.1"
imperium-api = { version = "0.1.0", path = "../imperium-api" }
reqwest = { version = "0.13.5", features = ["json", "multipart", "query"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["time"] }

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
