[package]
name = "imperium-automation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Schedules for Imperium projects: cron, interval, and one-shot triggers with missed-run handling"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"
