[package]
name = "imperiumd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium daemon"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
constant_time_eq = "0.6.1"
getrandom = "0.4.3"
imperium-config = { version = "0.1.0", path = "../imperium-config" }
imperium-core = { version = "0.1.0", path = "../imperium-core" }
imperium-protocol = { version = "0.1.0", path = "../imperium-protocol" }
imperium-tools = { version = "0.1.0", path = "../imperium-tools" }
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
imperium-config = { path = "../imperium-config" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.30.0"
