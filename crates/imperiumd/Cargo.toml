[package]
name = "imperiumd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium daemon"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
constant_time_eq = "0.6.1"
getrandom = "0.4.3"
imperium-automation = { version = "0.1.0", path = "../imperium-automation" }
imperium-config = { version = "0.1.0", path = "../imperium-config" }
imperium-core = { version = "0.1.0", path = "../imperium-core" }
imperium-extensions = { version = "0.1.0", path = "../imperium-extensions" }
imperium-github = { version = "0.1.0", path = "../imperium-github" }
imperium-local = { version = "0.1.0", path = "../imperium-local" }
imperium-mcp = { version = "0.1.0", path = "../imperium-mcp" }
imperium-media = { version = "0.1.0", path = "../imperium-media" }
imperium-memory = { version = "0.1.0", path = "../imperium-memory" }
imperium-pets = { version = "0.1.0", path = "../imperium-pets" }
imperium-protocol = { version = "0.1.0", path = "../imperium-protocol" }
imperium-tools = { version = "0.1.0", path = "../imperium-tools" }
imperium-web = { version = "0.1.0", path = "../imperium-web" }
imperium-workflow = { version = "0.1.0", path = "../imperium-workflow" }
notify-rust = "4.18.2"
serde = "1.0.229"
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[lints]
workspace = true

[dev-dependencies]
futures-util = "0.3.34"
imperium-config = { path = "../imperium-config" }
imperium-github = { path = "../imperium-github" }
reqwest = { version = "0.13.5", features = ["json"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"
