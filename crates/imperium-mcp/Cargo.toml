[package]
name = "imperium-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Model Context Protocol client for Imperium: stdio and streamable HTTP servers"

[dependencies]
futures-util = "0.3.34"
imperium-api = { version = "0.1.0", path = "../imperium-api" }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "sync", "time", "process", "io-util", "macros"] }
tracing = "0.1.44"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
