[package]
name = "imperium-script"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Daemon side of run_script: launches one confined Monty worker per program and drives its protocol"

# The same Monty release as the worker (runtimes/monty.env), pinned exactly.
[dependencies]
monty-proto = "=1.6.0"
monty-types = "=1.6.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "io-util", "time", "sync", "rt", "macros"] }

[lints]
workspace = true
