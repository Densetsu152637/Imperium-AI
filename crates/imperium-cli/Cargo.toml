[package]
name = "imperium-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium command-line client"

[[bin]]
name = "imperium"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
imperium-config = { version = "0.1.0", path = "../imperium-config" }
imperium-local = { version = "0.1.0", path = "../imperium-local" }
imperium-memory = { version = "0.1.0", path = "../imperium-memory" }
imperium-protocol = { version = "0.1.0", path = "../imperium-protocol" }
reqwest = "0.13.5"
rpassword = "7.5.4"
serde = "1.0.229"
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "net"] }
tokio-tungstenite = "0.30.0"
toml = "1.2.1"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
imperiumd = { path = "../imperiumd" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net"] }
