[package]
name = "imperium-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The Imperium command-line client"

[[bin]]
name = "imperium"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
imperium-api = { version = "0.2.0", path = "../imperium-api" }
imperium-client = { version = "0.2.0", path = "../imperium-client" }
imperium-config = { version = "0.2.0", path = "../imperium-config" }
imperium-engine = { version = "0.2.0", path = "../imperium-engine" }
imperium-local = { version = "0.2.0", path = "../imperium-local" }
imperium-memory = { version = "0.2.0", path = "../imperium-memory" }
imperium-models = { version = "0.2.0", path = "../imperium-models" }
imperium-policy = { version = "0.2.0", path = "../imperium-policy" }
imperium-protocol = { version = "0.2.0", path = "../imperium-protocol" }
imperium-tools = { version = "0.2.0", path = "../imperium-tools" }
imperium-web = { version = "0.2.0", path = "../imperium-web" }
imperium-workflow = { version = "0.2.0", path = "../imperium-workflow" }
reqwest = "0.13.5"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.54.1", features = ["rt", "macros", "net", "sync", "signal", "io-std", "io-util", "time"] }
toml = "1.2.1"

[lints]
workspace = true

[dev-dependencies]
axum = "0.8.9"
imperium-core = { path = "../imperium-core" }
imperium-ipc = { path = "../imperium-ipc" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }
