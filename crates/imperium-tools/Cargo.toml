[package]
name = "imperium-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Built-in agent tools (files, commands) confined to a workspace"

[dependencies]
imperium-api = { version = "0.2.0", path = "../imperium-api" }
# Children inherit no descriptor beyond stdio (`close_inherited_on_exec`).
imperium-ipc = { version = "0.2.0", path = "../imperium-ipc" }
imperium-policy = { version = "0.2.0", path = "../imperium-policy" }
# Walks folders for glob and grep the way ripgrep does, honouring .gitignore and .ignore files.
ignore = "0.4.23"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "fs", "time", "io-util", "rt", "macros", "sync"] }

[target.'cfg(windows)'.dependencies]
# Background commands run in a Job Object that kills every process in it when it is closed.
win32job = "2.0.3"

[features]
# Test helpers for the process-wide lists the daemon registers (`forget_daemon_paths`). Enabled
# only by this crate's own dev-dependency below; no production build turns it on.
test-support = []

[lints]
workspace = true

[dev-dependencies]
imperium-tools = { path = ".", features = ["test-support"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt", "macros", "process", "fs", "time"] }
