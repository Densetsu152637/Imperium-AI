[package]
name = "imperium-github"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "GitHub for Imperium auto-fix and the pull-request card: the gh CLI and an HTTP client (GraphQL and REST), and Git worktree operations"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
tokio = { version = "1.54.1", features = ["process", "rt", "macros", "time"] }

[lints]
workspace = true

[dev-dependencies]
imperium-config = { path = "../imperium-config" }
imperium-github-fake = { path = "../imperium-github-fake" }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
