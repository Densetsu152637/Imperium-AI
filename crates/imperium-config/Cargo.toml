[package]
name = "imperium-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Layered configuration, data paths, and keychain secrets for Imperium"

[dependencies]
directories = "6.0.0"
keyring = "3.6.3"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.21"
toml = "1.2.1"

[lints]
workspace = true

[dev-dependencies]
tempfile = "3.27.0"

# keyring needs one native backend per platform; without these it silently uses an in-memory mock.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6.3", features = ["apple-native"] }

[target.'cfg(windows)'.dependencies]
keyring = { version = "3.6.3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", features = ["sync-secret-service", "crypto-rust"] }
