name: Advisories

# Weekly: the RustSec advisory check over the whole lock file (cargo-deny, deny.toml), and GitHub's
# security advisories for the Monty crates that run model-written programs (docs/plans/code-mode.md,
# C1 "Pinning and supply chain"). A new advisory for Monty opens an issue; it does not gate merges.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/advisories.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  advisories:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories

  monty:
    name: monty security advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List advisories for the Monty crates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          found=""
          for crate in monty monty-proto monty-types monty-alloc; do
            ids="$(gh api "advisories?ecosystem=rust&affects=${crate}&per_page=100" --jq '.[] | select(.withdrawn_at == null) | "\(.ghsa_id)\t\(.severity)\t\(.summary)"')"
            [ -z "$ids" ] || found+="${ids}"$'\n'
          done
          found="$(sort -u <<<"$found" | sed '/^$/d')"
          if [ -z "$found" ]; then
            echo "No published GitHub security advisories for the Monty crates."
            exit 0
          fi
          echo "$found"
          # Pull requests only report; the weekly run opens one issue per new advisory.
          [ "$EVENT" != "pull_request" ] || exit 0
          while IFS=$'\t' read -r ghsa severity summary; do
            title="Monty security advisory ${ghsa}"
            if [ -n "$(gh issue list --state all --search "\"${title}\" in:title" --json number --jq '.[].number')" ]; then
              continue
            fi
            gh issue create --title "$title" --body "GitHub lists ${ghsa} (${severity}) for a Monty crate: ${summary}

          https://github.com/advisories/${ghsa}

          The pinned release is in runtimes/monty.env. A security fix is adopted as soon as the escape suite passes on it (docs/plans/code-mode.md, C1)."
          done <<<"$found"
