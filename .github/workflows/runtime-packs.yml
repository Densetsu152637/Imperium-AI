name: Runtime packs

on:
  push:
    branches: [main]
    paths:
      - runtimes/llama-cpp.env
      - scripts/ci/build-llama-runtime.sh
      - scripts/ci/publish-runtime-packs.sh
      - .github/workflows/runtime-packs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runtime-packs
  cancel-in-progress: false

jobs:
  build:
    name: llama.cpp (${{ matrix.pack }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - pack: linux-x64-cpu
            runner: ubuntu-22.04
            flags: -DGGML_NATIVE=OFF
          - pack: linux-x64-vulkan
            runner: ubuntu-22.04
            vulkan: true
            flags: -DGGML_NATIVE=OFF -DGGML_VULKAN=ON
          - pack: linux-x64-cuda12
            runner: ubuntu-22.04
            cuda: 12.9.1
            cuda_method: local
            flags: -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=61;75;80;86;89;90;120
          - pack: linux-x64-cuda13
            runner: ubuntu-22.04
            cuda: 13.3.1
            cuda_method: local
            flags: -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;100;120
          - pack: linux-arm64-cpu
            runner: ubuntu-22.04-arm
            flags: -DGGML_NATIVE=OFF
          - pack: windows-x64-cpu
            runner: windows-latest
            flags: -DGGML_NATIVE=OFF
          - pack: windows-x64-vulkan
            runner: windows-latest
            vulkan: true
            flags: -DGGML_NATIVE=OFF -DGGML_VULKAN=ON
          - pack: windows-x64-cuda12
            runner: windows-latest
            cuda: 12.9.1
            cuda_method: network
            flags: -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=61;75;80;86;89;90;120
          - pack: windows-x64-cuda13
            runner: windows-latest
            cuda: 13.3.1
            cuda_method: network
            flags: -DGGML_NATIVE=OFF -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=75;80;86;89;90;100;120
          - pack: windows-arm64-cpu
            runner: windows-11-arm
            flags: -DGGML_NATIVE=OFF
          - pack: macos-arm64-metal
            runner: macos-latest
            flags: -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON
          - pack: macos-x64-cpu
            runner: macos-latest
            flags: -DGGML_NATIVE=OFF -DGGML_METAL=OFF -DCMAKE_OSX_ARCHITECTURES=x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.cuda
        uses: Jimver/cuda-toolkit@b8bf9c6c28f8a92fbb04dcfcaee872e60c57462d # v0.2.36
        with:
          cuda: ${{ matrix.cuda }}
          method: ${{ matrix.cuda_method }}
      - if: matrix.vulkan
        uses: jakoch/install-vulkan-sdk-action@7fe84289ddbf750f7eff9f8e4588e600e1dd06c8 # v1.8.1
        with:
          cache: true
      - name: Build pack
        shell: bash
        env:
          PACK: ${{ matrix.pack }}
          CMAKE_FLAGS: ${{ matrix.flags }}
        run: bash scripts/ci/build-llama-runtime.sh "$PACK"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-${{ matrix.pack }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # ROCm builds in AMD's image; the image is large, so failures here don't block other packs.
  rocm:
    name: llama.cpp (linux-x64-rocm)
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    continue-on-error: true
    container: rocm/dev-ubuntu-22.04:7.2.4
    steps:
      - name: Install build tools
        run: apt-get update && apt-get install -y --no-install-recommends git cmake build-essential hipblas-dev rocblas-dev
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build pack
        shell: bash
        env:
          CMAKE_FLAGS: -DGGML_NATIVE=OFF -DGGML_HIP=ON -DAMDGPU_TARGETS=gfx90a;gfx942;gfx1030;gfx1100;gfx1101;gfx1102;gfx1200;gfx1201
        run: bash scripts/ci/build-llama-runtime.sh linux-x64-rocm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-linux-x64-rocm
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [build, rocm]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: runtime-*
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-runtime-packs.sh "$GITHUB_SHA"
