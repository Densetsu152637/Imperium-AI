name: GitHub live check

# A read-only check of imperium-github's client against the real GitHub API
# (crates/imperium-github/tests/live.rs, `--ignored`), documented in docs/11-ci-cd.md
# ("GitHub live check"). It needs the network and GitHub's own answers, so it does not gate merges:
# it runs on pushes to experimental, weekly, by hand, and on a pull request from this repository
# only when the check itself changes. It never runs on a pull request from a fork, and the token
# it gets is read-only.
on:
  push:
    branches: [experimental]
  schedule:
    - cron: "41 4 * * 2"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/github-live.yml"
      - "crates/imperium-github/tests/live.rs"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  live:
    name: github live check
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # Informational until it has passed twice (docs/11-ci-cd.md); then remove this line.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the live check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cargo test -p imperium-github --test live --locked -- --ignored --nocapture
